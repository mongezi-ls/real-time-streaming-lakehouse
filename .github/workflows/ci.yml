name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff check
        run: ruff check .

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest==8.2.0 pyyaml==6.0.1

      - name: Run tests
        run: pytest tests/ -v

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-core==1.7.0 dbt-databricks==1.7.0

      - name: dbt parse
        working-directory: transform/kraken_analytics
        env:
          DBT_DATABRICKS_TOKEN: "dummy-not-used-for-parse"
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<EOF
          kraken_analytics:
            target: dev
            outputs:
              dev:
                type: databricks
                host: "dummy.cloud.databricks.com"
                http_path: "/sql/1.0/warehouses/dummy"
                token: "dummy"
                catalog: workspace
                schema: default
                threads: 1
          EOF
          dbt parse