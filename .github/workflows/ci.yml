name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: pip install ruff==0.4.4

      - name: Run ruff check
        run: ruff check .

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          pip install --upgrade pip
          pip install pytest==8.2.0 pyyaml==6.0.1 confluent-kafka==2.4.0 websockets==12.0 python-dotenv==1.0.1

      - name: Run tests
        run: pytest tests/ -v

  dbt-parse:
    name: dbt parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-core==1.7.0 dbt-databricks==1.7.0 databricks-sdk==0.17.0 protobuf==4.25.3

      - name: dbt parse
        working-directory: transform/kraken_analytics
        env:
          DBT_PROFILES_DIR: ${{ github.workspace }}/ci
          DBT_DATABRICKS_TOKEN: "dummy"
        run: dbt parse